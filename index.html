<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المصطفى</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f1e8, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .page {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            font-size: 32px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #222;
        }

        .subtitle {
            color: #777;
            margin: 10px 0 30px;
            font-size: 16px;
        }

        .button {
            display: block;
            text-decoration: none;
            padding: 17px;
            margin: 15px 0;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 7px 18px rgba(0,0,0,.12);
            transition: .2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .facebook {
            background: #1877F2;
        }

        .tiktok {
            background: #111;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="logo">
        ✨
    </div>

    <h1>المصطفى</h1>

    <div class="subtitle">
        تابعنا على منصات التواصل الاجتماعي
    </div>

    <a class="button facebook"
       href="https://www.facebook.com/profile.php?id=61576313278652"
       target="_blank">
        🔵 فيسبوك
    </a>

    <a class="button tiktok"
       href="https://www.tiktok.com/@almustafa.jew"
       target="_blank">
        🎵 تيك توك
    </a>

    <div class="footer">
        أهلاً وسهلاً بكم ❤️
    </div>

</div>

</body>
</html>
